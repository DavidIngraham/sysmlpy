name: Test Commit

on:
  push:
    branches:
      - '*'
      - '!main'
  pull_request:

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Restore OMG SysML-v2-Release corpus cache
        uses: actions/cache@v4
        with:
          path: .cache/SysML-v2-Release
          key: sysml-v2-release-fb97b75
      - name: Fetch OMG SysML-v2-Release corpus (pinned fb97b75)
        run: |
          if [ ! -d .cache/SysML-v2-Release ]; then
            git clone --filter=blob:none --quiet \
              https://github.com/Systems-Modeling/SysML-v2-Release.git \
              .cache/SysML-v2-Release
            git -C .cache/SysML-v2-Release checkout --quiet fb97b754f29588b8e9c7a35f370880cd15eb29e7
          fi
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade setuptools
          pip install -r requirements.txt
          pip install -e ".[graph,kuzu,xlsx,sim,reqif]"
      - name: Test ${{ github.event.push.head }} coverage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYSML2_RELEASE_DIR: ${{ github.workspace }}/.cache/SysML-v2-Release
        run: |
          python -m pip install coveralls pytest
          python -m coverage run --source=src -m pytest tests -x -q || exit 1
          coverage report
          coveralls
      - name: Test with pytest
        env:
          SYSML2_RELEASE_DIR: ${{ github.workspace }}/.cache/SysML-v2-Release
        run: |
          pip install pytest-timeout pytest-html
          pytest --timeout=300 tests --doctest-modules --html=report-${{ matrix.python-version }}.html --self-contained-html --junitxml=junit/test-results-${{ matrix.python-version }}.xml
      - name: Upload pytest test results
        uses: actions/upload-artifact@v4
        with:
          name: pytest-junit-results-${{ matrix.python-version }}
          path: junit/test-results-${{ matrix.python-version }}.xml
        # Use always() to always run this step to publish test results when there are test failures
        if: ${{ always() }}
      - name: Upload pytest test results
        uses: actions/upload-artifact@v4
        with:
          name: pytest-html-results-${{ matrix.python-version }}
          path: report-${{ matrix.python-version }}.html
        # Use always() to always run this step to publish test results when there are test failures
        if: ${{ always() }}
