name: Release Workflow

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  documentation:
    name: Build MkDocs Documentation
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - name: Install dependencies
      run: pip install -r docs/requirements.txt
    - name: Build site
      run: mkdocs build
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./site

  codecoverage:
    name: Determine code and documentation coverage
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Install sysmlpy with test extras
      run: |
        pip install -e ".[graph,kuzu,xlsx,sim,reqif]"
    - name: Restore OMG SysML-v2-Release corpus cache
      uses: actions/cache@v4
      with:
        path: .cache/SysML-v2-Release
        key: sysml-v2-release-fb97b75
    - name: Fetch OMG SysML-v2-Release corpus (pinned fb97b75)
      run: |
        if [ ! -d .cache/SysML-v2-Release ]; then
          git clone --filter=blob:none --quiet \
            https://github.com/Systems-Modeling/SysML-v2-Release.git \
            .cache/SysML-v2-Release
          git -C .cache/SysML-v2-Release checkout --quiet fb97b754f29588b8e9c7a35f370880cd15eb29e7
        fi
    - name: Test coverage
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SYSML2_RELEASE_DIR: ${{ github.workspace }}/.cache/SysML-v2-Release
      run: |
        python -m pip install coveralls pytest pyyaml
        COLLECTED=$(python -m pytest --collect-only -q tests 2>/dev/null | tail -1)
        echo "collected: $COLLECTED"
        # Tripwire against the 0-tests-green failure mode (collection
        # errors used to abort the run before any test executed, and the
        # empty run still reported success). A healthy collection line is
        # "<N> tests collected in <T>s" with N > 0 — assert on a
        # non-zero count instead of error-substring guessing.
        echo "$COLLECTED" | grep -Eq '^[1-9][0-9]* tests collected' || {
          echo "::error::pytest collection is broken ('$COLLECTED') — refusing to report empty coverage"
          exit 1
        }
        python -m coverage run --source=src -m pytest tests || exit 1
        coverage report
        coveralls

  versioning:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    environment:
      name: pypi
      url: https://pypi.org/p/sysmlpy
    permissions:
      contents: write
      id-token: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - name: Install build dependencies
      run: pip install poetry
    - name: Build package
      run: poetry build
    - name: Publish package to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      # Trusted Publishing — no token needed
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        draft: false
